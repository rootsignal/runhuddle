name: Electron CI
on:
  workflow_dispatch:
    inputs:
      all_platforms:
        description: Include Windows and Linux
        type: boolean
        default: false
  push:
    paths: ['electron/**', '.github/workflows/electron.yml']
  pull_request:
    paths: ['electron/**', '.github/workflows/electron.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.all_platforms && '["macos-latest", "ubuntu-latest", "windows-latest"]' || '["macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Test Electron UI (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm run test:ui
      - name: Test Electron UI (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:ui
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload UI test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-ui-tests-${{ matrix.os }}
          path: electron/test-results/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: runhuddle-${{ matrix.os }}
          path: electron/dist/package/
          retention-days: 7
