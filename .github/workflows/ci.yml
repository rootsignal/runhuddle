name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 SDK
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare pinned terminal runtime
        run: bash scripts/prepare-ci-terminal.sh
      - run: python3 -m pip install -r scripts/requirements.txt
      - run: swift test --build-system native
      - name: Verify agent shell environments
        run: bash scripts/check-agent-launch-environment.sh
      - run: python3 -m unittest discover -s Tests -p 'test_*.py'
      - run: bash scripts/build-app.sh
      - run: python3 scripts/verify_standalone.py
