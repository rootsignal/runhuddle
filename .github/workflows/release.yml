name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    timeout-minutes: 120
    env:
      RUNHUDDLE_SIGN_IDENTITY: 'Developer ID Application: RootSignal LLC (C65AQBMSBJ)'
      RUNHUDDLE_NOTARY_PROFILE: RunHuddle-CI
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 SDK
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare pinned terminal runtime
        run: bash scripts/prepare-ci-terminal.sh
      - run: python3 -m pip install -r scripts/requirements.txt
      - run: swift test --build-system native
      - run: python3 -m unittest discover -s Tests -p 'test_*.py'
      - name: Import signing credentials
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE:?Missing signing certificate secret}"
          : "${CERTIFICATE_PASSWORD:?Missing certificate password secret}"
          : "${APPLE_ID:?Missing Apple ID secret}"
          : "${APPLE_PASSWORD:?Missing app-specific password secret}"
          keychain="$RUNNER_TEMP/runhuddle.keychain-db"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          printf '%s' "$CERTIFICATE" | /usr/bin/base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security import "$RUNNER_TEMP/signing.p12" -P "$CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          xcrun notarytool store-credentials "$RUNHUDDLE_NOTARY_PROFILE" --apple-id "$APPLE_ID" --team-id C65AQBMSBJ --password "$APPLE_PASSWORD" --keychain "$keychain"
          security default-keychain -d user -s "$keychain"
          rm "$RUNNER_TEMP/signing.p12"
      - run: bash scripts/build-app.sh
      - run: python3 scripts/verify_standalone.py
      - run: bash scripts/notarize.sh
      - name: Sign update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${SPARKLE_PRIVATE_KEY:?Configure the Sparkle signing secret, or release locally}"
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-key"
          RUNHUDDLE_SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle-key" bash scripts/generate-update-feed.sh
          rm "$RUNNER_TEMP/sparkle-key"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' dist/RunHuddle.app/Contents/Info.plist)
          gh release create "v$version" dist/*.dmg dist/*.dmg.sha256 dist/appcast.xml --target "$GITHUB_SHA" --title "RunHuddle $version" --draft --generate-notes
      - name: Remove temporary credentials
        if: always()
        run: |
          security default-keychain -d user -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/runhuddle.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/sparkle-key"
